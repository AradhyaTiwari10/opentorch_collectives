name: supply-chain-sim
description: >
  AI agent acts as a global supply chain operations manager, optimising
  procurement, inventory, logistics, and supplier decisions under uncertainty.
  Features:
  - Deterministic forced disruptions
  - Full event lifecycle management 
  - Novel carbon-footprint tracking mechanic that penalises high-emission
    emergency sourcing — creating a genuine speed-vs-sustainability trade-off.
space_url: "https://aradhya10-supply-chain-sim.hf.space"
github_url: "https://github.com/AradhyaTiwari10/opentorch_collectives"
tags:
  - openenv
  - supply-chain
  - logistics
  - multi-objective
  - sustainability
  - carbon-footprint
  - rl
  - real-world
tasks:
  - inventory_management
  - supplier_negotiation
  - disruption_response
baseline_scores:
